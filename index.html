<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CooperCar — Gestão do Veículo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<style>
/* Layout: barra de demonstração fixa no topo; associado = trilho lateral (desktop) ou navegação inferior (celular);
   início abre com o hodômetro + placa como peça principal, o resto em listas agrupadas e silenciosas.
   Paleta provisória inspirada na sinalização viária: azul de serviço (destaque) e amarelo de advertência (próximo cuidado).
   Substitua os tokens abaixo quando a identidade oficial estiver disponível. */
:root{
  --bg:#EFF2F4;
  --surface:#FFFFFF;
  --surface-2:#F6F8F9;
  --sunken:#E4E9ED;
  --line:#D9E0E6;
  --line-strong:#BCC7D1;
  --fg:#13202C;
  --muted:#5A6977;
  --faint:#8794A1;
  --accent:#1D4E9A;
  --accent-hover:#163F7F;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3EBF6;
  --warn:#F2C230;
  --warn-ink:#7A5200;
  --warn-soft:#FBF3D9;
  --ok:#1E7046;
  --ok-soft:#E1F1E7;
  --danger:#B1261C;
  --danger-soft:#FBEAE8;
  --c-fuel:#1D4E9A;   --c-fuel-s:#E3EBF6;
  --c-maint:#8A5A06;  --c-maint-s:#F7EEDA;
  --c-tire:#3E4C5A;   --c-tire-s:#E6EAEE;
  --c-cost:#2C6A4C;   --c-cost-s:#E2EFE7;
  --c-other:#5B4F87;  --c-other-s:#ECE9F4;
  --overlay:rgba(12,22,32,.42);
  --odo-frame:#13202C;
  --shadow:0 1px 0 rgba(19,32,44,.04), 0 8px 24px -12px rgba(19,32,44,.18);
  --shadow-pop:0 18px 48px -16px rgba(19,32,44,.35);
  /* objetos físicos: placa Mercosul mantém as mesmas cores nos dois temas */
  --plate-bg:#FFFFFF; --plate-band:#1B3E93; --plate-ink:#121212; --plate-edge:#A9B3BD; --plate-band-ink:#FFFFFF;
  --f:'Archivo', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --r-panel:14px; --r-ctl:8px; --r-pill:999px;
  --side:max(16px, env(safe-area-inset-left, 0px));
  --side-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#161E26; --surface-2:#1A232C; --sunken:#0B1015; --line:#25313C; --line-strong:#3A4855;
    --fg:#E5EBF0; --muted:#97A5B2; --faint:#6E7C89;
    --accent:#6FA2E8; --accent-hover:#8CB6EE; --accent-ink:#0A1626; --accent-soft:#18283D;
    --warn:#E9B92C; --warn-ink:#F0C960; --warn-soft:#2D2614;
    --ok:#5CC48E; --ok-soft:#13291F; --danger:#F07A70; --danger-soft:#33191A;
    --c-fuel:#6FA2E8; --c-fuel-s:#18283D; --c-maint:#E2B05A; --c-maint-s:#2E2514; --c-tire:#AAB7C4; --c-tire-s:#222C36;
    --c-cost:#67C097; --c-cost-s:#15291F; --c-other:#A99BE0; --c-other-s:#231F36;
    --overlay:rgba(0,0,0,.6); --odo-frame:#2E3C49; --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-pop:0 18px 48px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#161E26; --surface-2:#1A232C; --sunken:#0B1015; --line:#25313C; --line-strong:#3A4855;
  --fg:#E5EBF0; --muted:#97A5B2; --faint:#6E7C89;
  --accent:#6FA2E8; --accent-hover:#8CB6EE; --accent-ink:#0A1626; --accent-soft:#18283D;
  --warn:#E9B92C; --warn-ink:#F0C960; --warn-soft:#2D2614;
  --ok:#5CC48E; --ok-soft:#13291F; --danger:#F07A70; --danger-soft:#33191A;
  --c-fuel:#6FA2E8; --c-fuel-s:#18283D; --c-maint:#E2B05A; --c-maint-s:#2E2514; --c-tire:#AAB7C4; --c-tire-s:#222C36;
  --c-cost:#67C097; --c-cost-s:#15291F; --c-other:#A99BE0; --c-other-s:#231F36;
  --overlay:rgba(0,0,0,.6); --odo-frame:#2E3C49; --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-pop:0 18px 48px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;font-stretch:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- Barra de demonstração ---------- */
.demo-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.demo-bar-in{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:var(--side);padding-right:var(--side-r);max-width:1400px;margin:0 auto}
.demo-flag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.demo-flag b{font-weight:600;color:var(--fg)}
.demo-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);flex:none}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-pill);padding:3px;margin-left:auto;flex:none}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:var(--r-pill);font-size:13.5px;font-weight:550;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);color:var(--muted);flex:none}
.icon-btn:hover{color:var(--fg);border-color:var(--line-strong)}
.seg .short{display:none}
@media (max-width:620px){
  .demo-flag .long{display:none}
  .seg .short{display:inline}.seg .long{display:none}
  .seg button{padding:6px 12px}
}

/* ---------- Logotipo provisório ---------- */
.logo{display:inline-flex;align-items:baseline;gap:0;font-stretch:125%;font-size:19px;letter-spacing:-.02em;color:var(--fg);text-decoration:none;line-height:1}
.logo b{font-weight:800}
.logo span{font-weight:400}
.logo i{display:inline-block;width:7px;height:7px;background:var(--accent);margin-left:3px;border-radius:1px;transform:translateY(-1px)}
.logo small{font-stretch:100%;font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;letter-spacing:0}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid transparent;font-weight:600;font-size:14.5px;text-decoration:none;transition:background .15s,border-color .15s,transform .08s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--line-strong)}
.btn-quiet{background:transparent;color:var(--accent);padding:0 8px;min-height:36px}
.btn-quiet:hover{background:var(--accent-soft)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:var(--line)}
.btn .ic{width:18px;height:18px}
.btn-sm{min-height:34px;padding:0 12px;font-size:13.5px}

/* ---------- Área do associado ---------- */
.member{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1400px;margin:0 auto;min-height:calc(100vh - 53px)}
.m-side{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 53px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:28px;padding:28px 18px 24px var(--side);border-right:1px solid var(--line)}
.m-nav{display:flex;flex-direction:column;gap:2px}
.m-nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:var(--r-ctl);font-weight:500;color:var(--muted);font-size:15px}
.m-nav button:hover{background:var(--surface);color:var(--fg)}
.m-nav button[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:650;box-shadow:inset 3px 0 0 var(--accent)}
.m-side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
.m-main{min-width:0;padding-block:28px 64px;padding-left:clamp(16px,4vw,48px);padding-right:var(--side-r)}
.m-top{display:none}
.screen{max-width:1080px;animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.bottom-nav{display:none}
@media (max-width:900px){
  .member{grid-template-columns:minmax(0,1fr)}
  .m-side{display:none}
  .m-main{padding-left:var(--side);padding-right:var(--side-r);padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
  .m-top{display:flex;align-items:center;justify-content:space-between;padding-block:12px}
  .bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px var(--side-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--side)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:6px 2px;font-size:11.5px;font-weight:550;color:var(--muted);border-radius:var(--r-ctl)}
  .bottom-nav button[aria-current="page"]{color:var(--accent)}
  .bottom-nav .reg .ic{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:34px;height:34px;padding:7px;margin-top:-4px}
  .bottom-nav .reg[aria-current="page"] .ic{box-shadow:0 0 0 4px var(--accent-soft)}
}

/* ---------- Tipografia de tela ---------- */
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.screen-head h1{font-stretch:118%;font-weight:700;font-size:clamp(26px,3.2vw,34px);line-height:1.1}
.screen-head p{color:var(--muted);margin-top:6px;max-width:60ch}
.h2{font-size:17px;font-weight:650;font-stretch:108%}
.lede{color:var(--muted)}
.label{font-size:13px;color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);background:var(--warn-soft);color:var(--warn-ink);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-muted{background:var(--sunken);color:var(--muted)}
.pill-warn{background:var(--warn-soft);color:var(--warn-ink)}

/* ---------- Painéis ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}

/* ---------- Início ---------- */
.greet{margin-bottom:22px}
.greet p{color:var(--muted);font-size:14px}
.greet h1{font-stretch:122%;font-weight:700;font-size:clamp(28px,4vw,42px);line-height:1.05;margin-top:4px}

.cluster{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px clamp(18px,3vw,32px) 22px;box-shadow:var(--shadow)}
.cluster-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.cluster-top h2{font-stretch:112%;font-size:clamp(20px,2.4vw,24px);font-weight:700;line-height:1.15;margin-top:2px}
.cluster-top h2 span{font-weight:400;color:var(--muted)}
.odo-wrap{margin-top:26px;position:relative;z-index:1}
.odo{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:6px}
.odo-digits{display:inline-flex;gap:3px;background:var(--odo-frame);padding:5px;border-radius:10px}
.odo-d{display:inline-grid;place-items:center;width:clamp(32px,6vw,50px);height:clamp(46px,8.4vw,70px);background:var(--surface);color:var(--fg);border-radius:5px;font-stretch:125%;font-weight:600;font-size:clamp(26px,5vw,42px);font-variant-numeric:tabular-nums;line-height:1}
.odo-d.lead{color:var(--faint)}
.odo-d.gap{margin-left:6px}
.odo-unit{font-stretch:125%;font-weight:600;font-size:20px;color:var(--muted);padding-bottom:6px}
.cluster-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);position:relative;z-index:1}
.cluster-foot p{font-size:13.5px;color:var(--muted)}
.cluster-car{position:absolute;right:-28px;bottom:66px;width:min(330px,40%);color:var(--line-strong);opacity:.5;pointer-events:none}
@media (max-width:700px){.cluster-car{display:none}}

.plate{display:inline-flex;flex-direction:column;min-width:148px;vertical-align:middle;border:1.5px solid var(--plate-edge);border-radius:7px;background:var(--plate-bg);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08);flex:none}
.plate-band{background:var(--plate-band);color:var(--plate-band-ink);font-size:8.5px;font-weight:700;letter-spacing:.12em;text-align:center;padding:2px 0 1px;font-stretch:115%}
.plate-num{white-space:nowrap;padding-inline:8px!important;color:var(--plate-ink);font-stretch:80%;font-weight:700;font-size:27px;text-align:center;letter-spacing:.04em;line-height:1.15;padding:1px 0 2px}
.plate.sm{min-width:104px}.plate.sm .plate-num{font-size:18px}.plate.sm .plate-band{font-size:6.5px}

.home{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1100px){
  .home{grid-template-columns:minmax(0,1fr)}
  .col{display:contents}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}
}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:var(--r-panel);border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s,transform .08s}
.quick button:hover{border-color:var(--accent)}
.quick button:active{transform:scale(.98)}
.quick b{font-weight:650;font-size:15px;line-height:1.2}
.quick small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
@media (max-width:480px){.quick button{padding:12px 6px;align-items:center;text-align:center;gap:8px}.quick b{font-size:13px;font-stretch:85%}.quick small{display:none}.rec-title{white-space:normal;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical}}

.cat-ic{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;flex:none}
.cat-ic .ic{width:19px;height:19px}
.k-abastecimento{background:var(--c-fuel-s);color:var(--c-fuel)}
.k-manutencao{background:var(--c-maint-s);color:var(--c-maint)}
.k-pneus{background:var(--c-tire-s);color:var(--c-tire)}
.k-despesas{background:var(--c-cost-s);color:var(--c-cost)}
.k-outros{background:var(--c-other-s);color:var(--c-other)}

.care{border-left:4px solid var(--warn)}
.care h3{font-size:18px;font-weight:650;font-stretch:108%;margin-top:10px;line-height:1.25}
.care p{color:var(--muted);font-size:14px;margin-top:4px}
.bar{height:8px;background:var(--sunken);border-radius:var(--r-pill);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;background:var(--warn);border-radius:var(--r-pill);transition:width .6s ease}
.bar-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:12px}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}

.contact{display:flex;align-items:center;gap:14px}
.contact .cat-ic{background:var(--accent-soft);color:var(--accent)}
.contact div{flex:1;min-width:0}
.contact p{font-size:13.5px;color:var(--muted)}

/* ---------- Lista de registros ---------- */
.rec-list{list-style:none;margin:0;padding:0}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 8px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;border-radius:0;transition:background .15s}
.rec-list li:first-child .rec{border-top:0}
.rec:hover{background:var(--surface-2)}
.rec-main{min-width:0}
.rec-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-side{text-align:right;font-variant-numeric:tabular-nums}
.rec-side b{display:block;font-weight:600}
.rec-side span{font-size:12.5px;color:var(--muted)}
.rec.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}

/* Tabela do histórico (desktop) */
.hist-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hist-table th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.hist-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.hist-table tbody tr{cursor:pointer;transition:background .15s}
.hist-table tbody tr:hover{background:var(--surface-2)}
.hist-table tbody tr:last-child td{border-bottom:0}
.hist-table .r{text-align:right}
.hist-table .cat{display:flex;align-items:center;gap:10px;white-space:nowrap}
.hist-table .cat .cat-ic{width:30px;height:30px;border-radius:8px}
.hist-table .cat .ic{width:16px;height:16px}
.hist-table .desc b{display:block;font-weight:600}
.hist-table .desc span{font-size:13px;color:var(--muted)}
.table-scroll{overflow-x:auto}
.only-wide{display:block}.only-narrow{display:none}
@media (max-width:760px){.only-wide{display:none}.only-narrow{display:block}}

/* ---------- Filtros ---------- */
.filters{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:7px 13px;font-size:13.5px;font-weight:550;color:var(--muted);transition:all .15s}
.chip:hover{border-color:var(--line-strong);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filter-row .field{min-width:160px}
.result-line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-bottom:10px}
.result-line b{color:var(--fg);font-weight:600}

/* ---------- Estado vazio ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 16px}
.empty .cat-ic{width:52px;height:52px;border-radius:14px;background:var(--sunken);color:var(--muted)}
.empty h3{font-size:17px;font-weight:650}
.empty p{color:var(--muted);max-width:44ch;font-size:14px}

/* ---------- Formulários ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .flabel{font-size:13.5px;font-weight:600}
.field label .opt{font-weight:400;color:var(--muted)}
.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:88px;resize:vertical;line-height:1.45}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.affix{position:relative}
.affix .input{padding-left:40px}
.affix .pre,.affix .post{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.affix .pre{left:12px}
.affix.r .input{padding-left:12px;padding-right:42px}
.affix .post{right:12px}
.field.invalid .input{border-color:var(--danger)}
.field.invalid .input:focus{box-shadow:0 0 0 3px var(--danger-soft)}
.err{font-size:13px;color:var(--danger);display:flex;gap:6px;align-items:flex-start}
.hint{font-size:12.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1px dashed var(--line-strong);background:transparent;border-radius:var(--r-pill);padding:4px 10px;font-size:12.5px;color:var(--muted)}
.suggest button:hover{border-style:solid;color:var(--fg)}
.calc{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-ctl);background:var(--accent-soft);color:var(--fg);font-size:14px}
.calc b{font-size:17px;font-stretch:110%;font-variant-numeric:tabular-nums}
.calc .ic{color:var(--accent)}
.sub-group{border:1px dashed var(--line-strong);border-radius:var(--r-panel);padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.sub-group legend{padding:0 6px;font-size:13.5px;font-weight:600}
@media (max-width:560px){.sub-group{grid-template-columns:minmax(0,1fr)}}

.cat-picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:22px}
.cat-picker button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;transition:border-color .15s,background .15s}
.cat-picker button:hover{border-color:var(--line-strong)}
.cat-picker button[aria-checked="true"]{border-color:var(--accent);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
@media (max-width:620px){
  .cat-picker{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .cat-picker button{grid-column:span 2;padding:10px 4px;font-size:12.5px}
  .cat-picker button:nth-child(4){grid-column:2 / span 2}
  .cat-picker .cat-ic{width:32px;height:32px}
}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:480px){.form-actions .btn{flex:1}}
.req-note{font-size:12.5px;color:var(--muted);margin-right:auto;align-self:center}

/* ---------- Meu veículo ---------- */
.veh{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.veh{grid-template-columns:minmax(0,1fr)}}
.photo{aspect-ratio:16/10;max-width:100%;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line-strong);display:grid;place-items:center;overflow:hidden;color:var(--faint);position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo svg.car{width:78%;color:var(--line-strong)}
.photo figcaption{position:absolute;left:12px;bottom:10px;font-size:12.5px;color:var(--muted);background:var(--surface);padding:3px 9px;border-radius:var(--r-pill);border:1px solid var(--line)}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.spec{display:grid;grid-template-columns:minmax(0,1fr);margin:0}
.spec > div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)}
.spec > div:first-child{border-top:0;padding-top:0}
.spec dt{color:var(--muted);font-size:14px}
.spec dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Minha CooperCar ---------- */
.profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-stretch:120%;font-weight:700;font-size:21px;flex:none}
.profile h2{font-stretch:114%;font-size:22px;font-weight:700}
.status{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:var(--ok-soft);margin-top:18px}
.status .ic{color:var(--ok);width:26px;height:26px}
.status b{display:block;color:var(--ok);font-weight:650}
.status p{font-size:13.5px;color:var(--muted)}
.acct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.acct{grid-template-columns:minmax(0,1fr)}}
.linkrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.linkrow:first-child{border-top:0}
.linkrow:hover b{color:var(--accent)}
.linkrow div{flex:1;min-width:0}
.linkrow b{font-weight:600;display:block}
.linkrow span{font-size:13px;color:var(--muted)}
.linkrow > .ic{color:var(--faint)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px}
.note .ic{width:18px;height:18px;color:var(--muted);margin-top:1px}

/* ---------- Painel administrativo ---------- */
.admin{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1400px;margin:0 auto;min-height:calc(100vh - 53px)}
.a-side{background:var(--fg);color:var(--bg);display:flex;flex-direction:column;gap:26px;padding:26px 16px 22px var(--side);position:sticky;top:calc(53px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 53px - env(safe-area-inset-top,0px))}
.a-side .logo{color:var(--bg)}
.a-side .logo small{color:var(--faint);display:block;margin:8px 0 0}
.a-side .logo{flex-wrap:wrap}
.a-nav{display:flex;flex-direction:column;gap:2px}
.a-nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--faint);text-align:left;padding:10px 12px;border-radius:var(--r-ctl);font-weight:500}
.a-nav button:hover{color:var(--bg)}
.a-nav button[aria-current="page"]{background:rgba(127,140,155,.22);color:var(--bg);font-weight:600}
.a-side-foot{margin-top:auto;font-size:12.5px;color:var(--faint);line-height:1.45}
.a-main{min-width:0;padding-block:28px 64px;padding-left:clamp(16px,3vw,40px);padding-right:var(--side-r)}
.a-top{display:none}
.demo-banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:12px;padding:12px 16px;margin-bottom:22px;font-size:13.5px;color:var(--fg)}
.demo-banner .ic{color:var(--warn-ink);margin-top:1px}
@media (max-width:900px){
  .admin{grid-template-columns:minmax(0,1fr)}
  .a-side{display:none}
  .a-top{display:flex;flex-direction:column;gap:10px;background:var(--fg);color:var(--bg);padding-block:14px 0;padding-left:var(--side);padding-right:var(--side-r)}
  .a-top .logo{color:var(--bg)}
  .a-top .logo small{color:var(--faint)}
  .a-tabs{display:flex;gap:4px;overflow-x:auto}
  .a-tabs button{border:0;background:transparent;color:var(--faint);padding:10px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
  .a-tabs button[aria-current="page"]{color:var(--bg);border-bottom-color:var(--warn)}
  .a-main{padding-left:var(--side);padding-right:var(--side-r);padding-block:20px 48px}
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .label{min-height:3em;line-height:1.5}
.kpi b{font-stretch:122%;font-size:clamp(28px,3.4vw,38px);font-weight:650;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.bars .row{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.bars .track{height:10px;background:var(--sunken);border-radius:var(--r-pill);overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:var(--r-pill)}
.bars .row b{text-align:right;font-variant-numeric:tabular-nums}

.adm-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.adm-table th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.adm-table td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.adm-table tbody tr{cursor:pointer;transition:background .15s}
.adm-table tbody tr:hover,.adm-table tbody tr:focus-visible{background:var(--surface-2)}
.adm-table tbody tr:last-child td{border-bottom:0}
.adm-table .r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.mini-av{width:30px;height:30px;border-radius:50%;background:var(--sunken);color:var(--fg);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.adm-cards{display:flex;flex-direction:column;gap:10px}
.adm-card{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.adm-card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.adm-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;color:var(--muted)}
.adm-card .meta b{color:var(--fg);font-weight:600}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search .input{padding-left:38px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0;margin-bottom:12px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px var(--side-r) 24px var(--side);background:var(--overlay);animation:fade .15s ease-out}
.modal[hidden]{display:none!important}
.dialog{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-pop);animation:pop .18s ease-out}
.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 8px}
.dialog-head h2{font-stretch:112%;font-size:20px;font-weight:700;line-height:1.2}
.dialog-body{padding:8px 22px 4px}
.dialog-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:16px 22px 20px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (max-width:620px){
  .modal{place-items:end stretch;padding:0}
  .dialog{width:100%;border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dialog-foot .btn{flex:1}
}
.confirm-box{background:var(--danger-soft);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}

/* ---------- Toasts ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100vw - 32px));pointer-events:none}
@media (max-width:900px){.has-bottom .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:12px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow-pop);font-size:14px;font-weight:500;pointer-events:auto;animation:toast .25s ease-out;width:100%}
.toast .ic{width:19px;height:19px;margin-top:1px}
.toast.ok .ic{color:var(--ok)}
.toast.err .ic{color:var(--danger)}
.toast.out{animation:toastout .2s ease-in forwards}
:root .toast.ok .ic{color:#6BD39E}
:root .toast.err .ic{color:#FF8E84}
@keyframes toast{from{opacity:0;transform:translateY(12px)}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>

<div class="demo-bar" role="region" aria-label="Controles da demonstração">
  <div class="demo-bar-in">
    <div class="demo-flag"><span class="demo-dot" aria-hidden="true"></span><span><b>Demonstração</b><span class="long">, todos os dados são fictícios</span></span></div>
    <div class="seg" role="group" aria-label="Escolher área da demonstração">
      <button type="button" data-area="member" aria-pressed="true"><span class="long">App do associado</span><span class="short">Associado</span></button>
      <button type="button" data-area="admin" aria-pressed="false"><span class="long">Painel administrativo</span><span class="short">Admin</span></button>
    </div>
    <button type="button" class="icon-btn" data-action="reset" title="Reiniciar demonstração" aria-label="Reiniciar demonstração"><svg class="ic"><use href="#i-reset"/></svg></button>
  </div>
</div>

<div id="member" class="member">
  <aside class="m-side" aria-label="Navegação do aplicativo">
    <a class="logo" href="#inicio" data-go="inicio" aria-label="CooperCar, início"><b>Cooper</b><span>Car</span><i></i></a>
    <nav class="m-nav" id="m-nav"></nav>
    <div class="m-side-foot">
      <button type="button" class="btn btn-ghost" data-action="contact"><svg class="ic"><use href="#i-chat"/></svg>Falar com a CooperCar</button>
      <p>Logotipo e cores provisórios.</p>
    </div>
  </aside>

function prng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const genCache = {};
function genRecords(m) {
  if (genCache[m.id]) return genCache[m.id];
  const rnd = prng(m.id + m.nome);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const between = (a, b) => a + rnd() * (b - a);
  const MAINT = [['Troca de óleo e filtro','Troca de óleo e do filtro de óleo.',280,450],['Revisão periódica','Revisão conforme o manual do fabricante.',600,1200],['Freios','Troca das pastilhas dianteiras.',380,620],['Bateria','Substituição da bateria.',450,700],['Ar-condicionado','Higienização e troca do filtro de cabine.',150,260]];
  const TIRES = [['Rodízio e balanceamento',90,160],['Calibragem e verificação do estepe',0,0],['Alinhamento de direção',80,140],['Reparo de furo no pneu traseiro',30,60],['Troca de dois pneus',900,1500]];
  const COSTS = [['Lavagem','Lavagem simples.',40,90],['Estacionamento','Diária de estacionamento.',20,45],['Pedágio','Pedágios de viagem.',15,80]];
  const OTHERS = [['Viagem registrada','Viagem de fim de semana, anotação do percurso.'],['Luz de alerta no painel','A luz acendeu e apagou. Anotado para avaliar na próxima revisão.'],['Risco na lateral','Pequeno risco na porta, sem dano profundo à pintura.']];
  const days = Array.from({ length: m.n }, () => Math.round(between(m.acc, m.cad))).sort((a, b) => a - b);
  let km = m.km - Math.round(between(20, 300));
  let prevDay = days[0] ?? 0;
  const out = days.map((d, i) => {
    km -= Math.round((d - prevDay) * between(25, 55)); prevDay = d;
    const roll = rnd(); const base = { id: `${m.id}-${i}`, date: daysAgo(d), km: Math.max(km, 1000) };
    if (roll < .45) { const valor = Math.round(between(150, 300)); return { ...base, cat:'abastecimento', valor, litros: Math.round(valor / between(5.6, 6.2) * 10) / 10 }; }

    const t = pick(OTHERS); return { ...base, cat:'outros', titulo:t[0], desc:t[1] };
  }).sort((a, b) => b.date.localeCompare(a.date));
  return (genCache[m.id] = out);
}

function animateOdo(from, to) {
  const el = $('#odo'); shownKm = to;
  if (!el) return;
  if (reduceMotion || from === to) { el.innerHTML = odoDigits(to); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const p = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - p, 3); el.innerHTML = odoDigits(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function fieldHTML(f, value = '', err) {
  const id = 'f-' + f.k, v = esc(value ?? '');
  const lab = `<label for="${id}">${f.label}${f.req ? '' : ' <span class="opt">(opcional)</span>'}</label>`;
  const aria = `aria-invalid="${err ? 'true' : 'false'}" aria-describedby="${id}-msg"`;
  let ctl;
  switch (f.type) {
    case 'date': ctl = `<input class="input" type="date" id="${id}" name="${f.k}" value="${v}" max="${iso(today0())}" ${aria}>`; break;
    case 'km': ctl = `<div class="affix r"><input class="input num" type="text" inputmode="numeric" autocomplete="off" id="${id}" name="${f.k}" value="${v}" placeholder="${f.ph || 'Ex.: 48.300'}" data-mask="km" ${aria}><span class="post">km</span></div>`; break;
    case 'money': ctl = `<div class="affix"><span class="pre">R$</span><input class="input num" type="text" inputmode="decimal" autocomplete="off" id="${id}" name="${f.k}" value="${v}" placeholder="0,00" ${aria}></div>`; break;
    case 'liters': ctl = `<div class="affix r"><input class="input num" type="text" inputmode="decimal" autocomplete="off" id="${id}" name="${f.k}" value="${v}" placeholder="Ex.: 40,5" ${aria}><span class="post">L</span></div>`; break;
    case 'year': ctl = `<input class="input num" type="text" inputmode="numeric" maxlength="4" id="${id}" name="${f.k}" value="${v}" ${aria}>`; break;
    case 'select': ctl = `<select class="input" id="${id}" name="${f.k}" ${aria}><option value="">Selecione</option>${f.options.map(o => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break;
    case 'textarea': ctl = `<textarea class="input" id="${id}" name="${f.k}" maxlength="${f.max || 400}" placeholder="${esc(f.ph || '')}" ${aria}>${v}</textarea>`; break;
    default: ctl = `<input class="input" type="text" id="${id}" name="${f.k}" value="${v}" maxlength="${f.max || 80}" placeholder="${esc(f.ph || '')}" ${aria}>`;
  }
  const sug = f.suggest ? `<div class="suggest" aria-label="Sugestões">${f.suggest.map(s => `<button type="button" data-fill="${f.k}" data-val="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : '';
  return `<div class="field ${f.full ? 'full' : ''} ${err ? 'invalid' : ''}" data-field="${f.k}">${lab}${ctl}${sug}<div id="${id}-msg">${err ? `<span class="err">${ic('alert')}${err}</span>` : f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div></div>`;
}
function showErrors(form, errs) {
  $$('.field', form).forEach(fd => {
    const k = fd.dataset.field; if (!k) return;
    const msg = $(`#f-${k}-msg`, form); const inp = form.elements[k];
    if (errs[k]) {
      fd.classList.add('invalid'); inp && inp.setAttribute('aria-invalid', 'true');
      if (msg) msg.innerHTML = `<span class="err">${ic('alert')}${errs[k]}</span>`;
    } else if (fd.classList.contains('invalid')) {
      fd.classList.remove('invalid'); inp && inp.setAttribute('aria-invalid', 'false');
      if (msg) msg.innerHTML = '';
    }
  });
  const keys = Object.keys(errs);
  if (keys.length) {
    const first = form.elements[keys[0]]; first && first.focus();
    toast(keys.length === 1 ? 'Revise o campo destacado.' : `Revise os ${keys.length} campos destacados.`, 'err');
    return true;
  }
  return false;
}
function bindMasks(root) {
  $$('[data-mask="km"]', root).forEach(inp => inp.addEventListener('input', () => {
    const digits = inp.value.replace(/\D/g, '').slice(0, 7);

}

function regFields() {

function calcHTML() {
  const valor = parseMoney(reg.values.valor), litros = parseMoney(reg.values.litros);

function switchCat(cat) {

function validateReg() {
  const v = reg.values, errs = {}, today = iso(today0());
  const fields = FORMS[reg.cat];
  const has = k => (v[k] ?? '').toString().trim() !== '';
  fields.forEach(f => { if (f.req && !has(f.k)) errs[f.k] = ({ date:'Informe a data.', km:'Informe a quilometragem.', valor:'Informe o valor.', servico:'Selecione o tipo de serviço.', tipo:'Selecione o tipo de despesa.', desc:'Descreva o que foi feito.', titulo:'Diga o que aconteceu.' })[f.k] || 'Campo obrigatório.'; });
  if (has('date') && !errs.date) { if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) errs.date = 'Use uma data válida.'; else if (v.date > today) errs.date = 'A data não pode estar no futuro.'; else if (v.date < '2000-01-01') errs.date = 'Use uma data a partir de 2000.'; }
  const kmField = fields.find(f => f.k === 'km');
  if (kmField && has('km') && !errs.km) { const km = parseKm(v.km); if (isNaN(km) || km < 1) errs.km = 'Use apenas números, por exemplo 48.300.'; else if (km > 1999999) errs.km = 'Confira o valor: parece alto demais.'; }
  if (has('valor') && !errs.valor) { const x = parseMoney(v.valor); if (isNaN(x) || x <= 0) errs.valor = 'Use um valor maior que zero, por exemplo 250,00.'; else if (x > 1000000) errs.valor = 'Confira o valor: parece alto demais.'; }
  if (reg.cat === 'abastecimento' && has('litros')) { const l = parseMoney(v.litros); if (isNaN(l) || l <= 0) errs.litros = 'Use um número maior que zero, por exemplo 40,5.'; else if (l > 300) errs.litros = 'Confira os litros: parece alto demais.'; }
  if (reg.cat === 'manutencao') {
    if (has('proxData')) { if (has('date') && v.proxData <= v.date) errs.proxData = 'A próxima data deve ser depois da data do serviço.'; }
    if (has('proxKm')) { const pk = parseKm(v.proxKm), km = parseKm(v.km); if (isNaN(pk)) errs.proxKm = 'Use apenas números.'; else if (!isNaN(km) && pk <= km) errs.proxKm = 'Deve ser maior que a quilometragem do serviço.'; }
  }
  return errs;
}
function submitReg(form) {
  // sincroniza valores atuais do formulário
  $$('input,select,textarea', form).forEach(el => { if (el.name) reg.values[el.name] = el.value; });
  const errs = validateReg();
  reg.errors = errs;
  if (showErrors(form, errs)) return;
  const v = reg.values, t = s => (s || '').trim();
  const r = { id: uid(), cat: reg.cat, date: v.date, created: true };
  const km = parseKm(v.km); if (!isNaN(km)) r.km = km;
  const valor = parseMoney(v.valor); if (valor > 0) r.valor = Math.round(valor * 100) / 100;
  if (reg.cat === 'abastecimento') { const l = parseMoney(v.litros); if (l > 0) r.litros = l; if (t(v.obs)) r.obs = t(v.obs); }
  if (reg.cat === 'manutencao') { r.servico = v.servico; r.desc = t(v.desc); if (v.proxData) r.proxData = v.proxData; const pk = parseKm(v.proxKm); if (!isNaN(pk)) r.proxKm = pk; }
  if (reg.cat === 'pneus') r.desc = t(v.desc);
  if (reg.cat === 'despesas') { r.tipo = v.tipo; if (t(v.desc)) r.desc = t(v.desc); }
  if (reg.cat === 'outros') { r.titulo = t(v.titulo); if (t(v.desc)) r.desc = t(v.desc); }
  S.records.push(r);
  let kmMsg = '';
  if (r.km && r.km > S.vehicle.km) { S.vehicle.km = r.km; kmMsg = ` Quilometragem atualizada para ${fmtKm(r.km)}.`; }
  save();
  const label = CATS[r.cat].short || CATS[r.cat].label;
  resetReg(reg.cat);
  highlightId = r.id;
  go('inicio');
  toast(`${label} registrado.${kmMsg}`);
}

/* ---------- Histórico ---------- */
let hf = { cat: 'todas', period: 'todos', from: '', to: '' };
const PERIODS = [['todos','Todo o período'],['30','Últimos 30 dias'],['90','Últimos 3 meses'],['180','Últimos 6 meses'],['ano','Este ano'],['custom','Escolher datas']];
function histFiltered() {
  let list = sorted();
  if (hf.cat !== 'todas') list = list.filter(r => r.cat === hf.cat);
  let from = '', to = '';
  if (['30','90','180'].includes(hf.period)) from = daysAgo(Number(hf.period));
  if (hf.period === 'ano') from = `${new Date().getFullYear()}-01-01`;
  if (hf.period === 'custom') { from = hf.from; to = hf.to; }
  if (from) list = list.filter(r => r.date >= from);
  if (to) list = list.filter(r => r.date <= to);
  return list;
}
const filtersActive = () => hf.cat !== 'todas' || hf.period !== 'todos';
function viewHistorico() {
  return `

    <div class="filter-row">
      <div class="field"><label for="hf-period">Período</label><select class="input" id="hf-period">${PERIODS.map(([k, l]) => `<option value="${k}" ${hf.period === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field" id="hf-from-w" ${hf.period === 'custom' ? '' : 'hidden'}><label for="hf-from">De</label><input class="input" type="date" id="hf-from" value="${hf.from}" max="${iso(today0())}"></div>
      <div class="field" id="hf-to-w" ${hf.period === 'custom' ? '' : 'hidden'}><label for="hf-to">Até</label><input class="input" type="date" id="hf-to" value="${hf.to}" max="${iso(today0())}"></div>
    </div>
  </div>
  <section class="panel" style="padding:clamp(12px,2vw,20px)" id="hist-out" aria-live="polite"></section>`;
}
function bindHist() {
  $('#hf-period').addEventListener('change', e => { hf.period = e.target.value; $('#hf-from-w').hidden = $('#hf-to-w').hidden = hf.period !== 'custom'; drawHist(); });
  $('#hf-from').addEventListener('change', e => { hf.from = e.target.value; drawHist(); });
  $('#hf-to').addEventListener('change', e => { hf.to = e.target.value; drawHist(); });
  drawHist();
}
function drawHist() {
  const all = sorted();
  const counts = Object.fromEntries(Object.keys(CATS).map(k => [k, all.filter(r => r.cat === k).length]));
  $('#hist-chips').innerHTML = [['todas', 'Todas', all.length], ...Object.entries(CATS).map(([k, c]) => [k, c.short || c.label, counts[k]])]
    .map(([k, l, n]) => `<button type="button" class="chip" data-hcat="${k}" aria-pressed="${hf.cat === k}">${l} <span class="num" style="opacity:.7">${n}</span></button>`).join('');
  const out = $('#hist-out');
  if (hf.period === 'custom' && hf.from && hf.to && hf.from > hf.to) {
    out.innerHTML = emptyHTML('calendar', 'Período inválido', 'A data inicial está depois da data final. Ajuste as datas ou limpe os filtros.', `<button type="button" class="btn btn-ghost" data-action="clear-filters">Limpar filtros</button>`);
    return;
  }
  const list = histFiltered();
  const total = list.reduce((s, r) => s + (r.valor || 0), 0);
  if (!list.length) {
    out.innerHTML = filtersActive()
      ? emptyHTML('search', 'Nenhum registro encontrado', 'Não há acontecimentos com esses filtros. Tente outro período ou categoria.', `<button type="button" class="btn btn-ghost" data-action="clear-filters">Limpar filtros</button>`)
      : emptyHTML('note', 'Nenhum acontecimento registrado', 'Seus registros de abastecimento, manutenção e outros cuidados aparecem aqui.', `<button type="button" class="btn btn-primary" data-go="registrar">Fazer o primeiro registro</button>`);
    return;
  }
  out.innerHTML = `
    <div class="result-line"><span><b>${list.length}</b> ${list.length === 1 ? 'registro' : 'registros'}, somando <b>${fmtBRL(total)}</b></span>
      ${filtersActive() ? `<button type="button" class="btn btn-quiet btn-sm" data-action="clear-filters">${ic('x')}Limpar filtros</button>` : ''}</div>
    <div class="only-wide table-scroll"><table class="hist-table">
      <thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th class="r">Quilometragem</th><th class="r">Valor</th></tr></thead>
      <tbody>${list.map(r => `<tr data-rec="${esc(r.id)}" tabindex="0" aria-label="Abrir detalhes: ${esc(recTitle(r))}">

        <td class="r">${r.km ? fmtKm(r.km) : '—'}</td>

    <ul class="rec-list only-narrow">${list.map(r => recItem(r)).join('')}</ul>`;
}

function openRecord(id, readOnly = false, list = S.records) {
  const r = list.find(x => x.id === id); if (!r) return;
  const rows = [
    ['Categoria', CATS[r.cat].label], ['Data', fmtDateLong(r.date)],
    ['Quilometragem', r.km ? fmtKm(r.km) : 'Não informada'],
  ];
  if (r.cat === 'manutencao') rows.unshift(['Serviço', r.servico]);
  if (r.cat === 'despesas') rows.unshift(['Tipo', r.tipo]);
  if (r.cat === 'outros') rows.unshift(['Acontecimento', r.titulo]);
  rows.push(['Valor', r.valor ? fmtBRL(r.valor) : 'Não informado']);
  if (r.cat === 'abastecimento') { rows.push(['Litros', r.litros ? fmtL(r.litros) : 'Não informado']); if (r.litros) rows.push(['Preço por litro', fmtBRL(r.valor / r.litros)]); if (r.obs) rows.push(['Observação', r.obs]); }
  if (r.desc) rows.push(['Descrição', r.desc]);
  if (r.cat === 'manutencao' && (r.proxData || r.proxKm)) rows.push(['Próxima prevista', [r.proxKm ? fmtKm(r.proxKm) : '', r.proxData ? fmtDate(r.proxData) : ''].filter(Boolean).join(' ou ')]);
  openModal({
    title: esc(recTitle(r)),
    body: `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">${catIc(r.cat)}<span class="label">${r.created ? 'Registrado nesta demonstração' : 'Registro fictício de exemplo'}</span></div>

      <div id="del-slot"></div>`,
    actions: readOnly ? `<button type="button" class="btn btn-primary" data-action="close-modal">Fechar</button>`
      : `<button type="button" class="btn btn-danger-ghost" data-action="ask-delete" data-id="${esc(r.id)}" style="margin-right:auto">${ic('trash')}Excluir</button><button type="button" class="btn btn-primary" data-action="close-modal">Fechar</button>`,
  });
}

      </dl></section>
    <section class="panel"><h2 class="h2" style="margin-bottom:12px">Veículo vinculado</h2>
      ${m.veic ? `<dl class="spec"><div><dt>Veículo</dt><dd>${esc(m.veic)}</dd></div><div><dt>Placa</dt><dd>${plateHTML(m.placa, true)}</dd></div><div><dt>Quilometragem</dt><dd>${fmtKm(m.km)}</dd></div></dl>`
        : emptyHTML('car', 'Nenhum veículo vinculado', 'O associado criou a conta mas ainda não cadastrou um veículo.')}
    </section>
  </div>
  <section class="panel" style="padding:clamp(12px,2vw,20px)">
    <div class="panel-head"><h2 class="h2">Histórico de acontecimentos</h2><span class="label">${m.records.length} ${m.records.length === 1 ? 'registro' : 'registros'}</span></div>
    ${m.records.length ? `<div class="only-wide table-scroll"><table class="hist-table"><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th class="r">Quilometragem</th><th class="r">Valor</th></tr></thead>
      <tbody>${m.records.map(r => `<tr data-arec="${esc(r.id)}" tabindex="0"><td>${fmtDate(r.date)}</td><td><span class="cat">${catIc(r.cat)}${CATS[r.cat].short || CATS[r.cat].label}</span></td><td class="desc"><b>${esc(recTitle(r))}</b><span>${esc(recSub(r))}</span></td><td class="r">${r.km ? fmtKm(r.km) : '—'}</td><td class="r">${r.valor ? fmtBRL(r.valor) : '—'}</td></tr>`).join('')}</tbody></table></div>
      <ul class="rec-list only-narrow">${m.records.map(r => recItem(r).replace('data-rec=', 'data-arec=')).join('')}</ul>`
      : emptyHTML('note', 'Sem registros ainda', 'Quando o associado registrar acontecimentos no aplicativo, eles aparecem aqui.')}
  </section>`;
}

/* ---------- modal e toasts ---------- */
let lastFocus = null;
function openModal({ title, body, actions }) {
  lastFocus = document.activeElement;
  $('#dlg-title').innerHTML = title; $('#dlg-body').innerHTML = body; $('#dlg-foot').innerHTML = actions || '';
  $('#modal').hidden = false; document.body.style.overflow = 'hidden';
  const first = $('#dlg-body input, #dlg-body select, #dlg-body textarea') || $('#dlg-foot .btn-primary') || $('.dialog [data-action="close-modal"]');
  setTimeout(() => first && first.focus(), 30);
}
function closeModal() {
  $('#modal').hidden = true; document.body.style.overflow = '';
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function toast(msg, kind = 'ok') {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.innerHTML = `${ic(kind === 'err' ? 'alert' : kind === 'info' ? 'info' : 'check')}<span>${esc(msg)}</span>`;
  const box = $('#toasts'); while (box.children.length >= 2) box.firstElementChild.remove();
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, kind === 'err' ? 4200 : 3400);
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-area],[data-action],[data-quick],[data-cat],[data-rec],[data-arec],[data-hcat],[data-member],[data-fill]');
  if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  if (el.dataset.go) { e.preventDefault(); if (!$('#modal').hidden) closeModal(); go(el.dataset.go); return; }
  if (el.dataset.area) { go(el.dataset.area === 'admin' ? 'admin' : screen); return; }
  if (el.dataset.quick) { resetReg(el.dataset.quick); go('registrar'); return; }
  if (el.dataset.cat) { switchCat(el.dataset.cat); return; }
  if (el.dataset.hcat) { hf.cat = el.dataset.hcat; drawHist(); return; }
  if (el.dataset.member) { adminMemberId = el.dataset.member; go('admin-associado'); return; }
  if (el.dataset.arec) { const m = members().find(x => x.id === adminMemberId); m && openRecord(el.dataset.arec, true, m.records); return; }
  if (el.dataset.rec) { openRecord(el.dataset.rec); return; }
  if (el.dataset.fill) { const inp = $(`#f-${el.dataset.fill}`); if (inp) { inp.value = el.dataset.val; reg.values[el.dataset.fill] = el.dataset.val; inp.focus(); } return; }
  switch (el.dataset.action) {
    case 'contact': contact(); break;
    case 'close-modal': closeModal(); break;
    case 'edit-vehicle': editVehicle(); break;
    case 'remove-photo': if (photoURL) URL.revokeObjectURL(photoURL); photoURL = null; render(); toast('Foto removida.'); break;
    case 'cancel-reg': resetReg(reg.cat); go(prevScreen && prevScreen !== 'registrar' ? prevScreen : 'inicio'); toast('Registro cancelado. Nada foi salvo.', 'info'); break;
    case 'clear-filters': hf = { cat: 'todas', period: 'todos', from: '', to: '' }; render(); toast('Filtros limpos.', 'info'); break;
    case 'clear-admin': af = { q: '', status: 'todas', sort: af.sort }; render(); break;
    case 'ask-delete': askDelete(el.dataset.id); break;
    case 'cancel-delete': $('#del-slot').innerHTML = ''; break;
    case 'do-delete': S.records = S.records.filter(r => r.id !== el.dataset.id); save(); closeModal(); render(); toast('Registro excluído.'); break;
    case 'reset':
      openModal({
        title: 'Reiniciar demonstração?',
        body: `<p>Os registros criados e as alterações feitas nesta apresentação serão apagados, e os dados fictícios iniciais voltam ao lugar.</p>`,
        actions: `<button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="button" class="btn btn-danger" data-action="do-reset">Reiniciar</button>`,
      }); break;
    case 'do-reset':
      try { localStorage.removeItem(STORE_KEY); } catch (err) {}
      S = seed(); shownKm = S.vehicle.km; resetReg('abastecimento'); hf = { cat: 'todas', period: 'todos', from: '', to: '' }; af = { q: '', status: 'todas', sort: 'nome' };
      if (photoURL) URL.revokeObjectURL(photoURL); photoURL = null;
      closeModal(); render(); toast('Demonstração reiniciada com os dados iniciais.'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-rec],tr[data-member],tr[data-arec]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Tab' && !$('#modal').hidden) {
    const f = $$('.dialog button, .dialog input, .dialog select, .dialog textarea, .dialog a[href], .dialog label[for]').filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

/* ---------- início ---------- */
(function init() {
  const h = location.hash.slice(1);
  if (h.startsWith('admin')) { area = 'admin'; adminView = h === 'admin' ? 'visao' : 'lista'; }
  else if (MEMBER_SCREENS.includes(h)) screen = h;
  render();
})();
</script>
